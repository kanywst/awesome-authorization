name: Link Check

on:
  schedule:
    - cron: '0 0 * * 0' # Weekly on Sunday
  workflow_dispatch:

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --config lychee.toml --verbose --no-progress README.md
          # Fail the job on dead links. lychee.toml already presents a browser
          # User-Agent, accepts 403/406/429 and retries, so a red run means real
          # link rot rather than anti-bot noise.
          fail: true
